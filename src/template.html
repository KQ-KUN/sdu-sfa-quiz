<body>
<header><div class="logo" role="img" aria-label="山东大学学生科幻协会会徽"></div><div><div class="brand">山东大学学生科幻协会</div></div><div class="tools"><button class="quiet" id="fullscreen" aria-label="切换全屏">⛶ <span class="fullscreen-label">全屏</span></button><button class="quiet" id="settings">现场设置</button></div></header>
<main id="app" tabindex="-1"></main>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">招新现场设置</h2><button class="dialog-close" data-close aria-label="关闭设置">×</button></div><p class="dialog-copy">当前已内置招新群二维码。群码更新时，可在这里替换图片，再导出一份包含新二维码的游戏发给平板。</p><label for="qr-upload">更换二维码图片</label><input type="file" id="qr-upload" accept="image/png,image/jpeg,image/webp"><div id="settings-preview"></div><label for="group-input">备用群号（可留空）</label><input id="group-input" type="text" inputmode="numeric" maxlength="30"><p id="settings-status" role="status"></p><div class="dialog-buttons"><button id="save-settings" class="primary">保存设置</button><button id="export" class="quiet">导出可发送的 HTML</button><button id="restore-settings" class="quiet">恢复内置二维码</button></div><p class="dialog-copy">替换图片请尽量只保留二维码与四周留白。保存仅作用于当前浏览器；导出后，二维码会随文件一起发送。</p></dialog>
<dialog id="qr-dialog" aria-label="放大招新二维码"><div class="dialog-head"><h2>扫码加入我们的宇宙</h2><button class="dialog-close" data-close aria-label="关闭二维码">×</button></div><div id="large-qr"></div><p class="group" id="large-group"></p><p class="dialog-copy">请用另一台设备的 QQ 扫一扫。若扫码失败，可用群号搜索。</p></dialog>
<dialog id="restart-dialog" aria-labelledby="restart-title"><div class="dialog-head"><h2 id="restart-title">结束本轮答题？</h2><button class="dialog-close" data-close aria-label="关闭确认">×</button></div><p class="dialog-copy">本轮进度将清空，回到首页供下一位同学开始。</p><div class="dialog-buttons"><button class="primary" id="confirm-restart">返回首页</button><button class="quiet" data-close>继续答题</button></div></dialog>
<script type="application/json" id="asset-data">__ASSETS__</script>
<script type="application/json" id="embedded-config">__CONFIG__</script>
<script type="application/json" id="question-data">__QUESTIONS__</script>
<script>__CORE__</script>
<script>
'use strict';
const ASSETS=JSON.parse(document.getElementById('asset-data').textContent);
const DEFAULT_CONFIG=JSON.parse(document.getElementById('embedded-config').textContent);
const QUESTIONS=JSON.parse(document.getElementById('question-data').textContent);
const app=document.getElementById('app');
const STORE='sdu-sfa-recruitment-v1';
document.documentElement.style.setProperty('--mascot',`url("${ASSETS.mascot}")`);
document.documentElement.style.setProperty('--logo',`url("${ASSETS.logo}")`);
let config={...DEFAULT_CONFIG};
function validConfig(v){return v&&typeof v.qr==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v.qr)&&v.qr.length<6000000&&typeof v.group==='string'&&v.group.length<=30&&typeof v.crop==='boolean';}
try{const saved=JSON.parse(localStorage.getItem(STORE));if(validConfig(saved))config=saved;}catch{}
let stage='home',round=[],index=0,answers=[],pending={...config},imageBusy=false,uploadVersion=0,selectedDifficulty='easy';
const difficultyLabel=()=>selectedDifficulty==='easy'?'简单':'困难';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mascot(col,row,cls=''){return `<div class="sprite ${cls}" role="img" aria-label="社娘表情" style="--x:${col*100/3}%;--y:${row*100/3}%"></div>`;}
function qrMarkup(v,cls=''){return `<span class="qr-frame ${v.crop?'cropped':''} ${cls}"><img src="${esc(v.qr)}" alt="山东大学学生科幻协会招新群二维码"></span>`;}
function score(){return answers.filter(a=>a.correct).length;}
function focusPage(){app.focus({preventScroll:true});window.scrollTo(0,0);}
function home(){stage='home';round=[];answers=[];index=0;app.innerHTML=`<section class="landing"><div><h1>你的脑洞，<br>适合<em>哪片宇宙？</em></h1><p class="intro">从《三体》到遥远的银河系，<br>用十道科幻小题，寻找同频的星际旅伴。</p><div class="facts"><div class="fact"><b>10</b><span>道科幻小题</span></div><div class="fact"><b>2–4</b><span>分钟轻松探索</span></div><div class="fact"><b>30</b><span>每档备选题</span></div></div><div class="difficulty-selector" role="group" aria-label="选择难度"><button class="difficulty ${selectedDifficulty==='easy'?'selected':''}" id="choose-easy" aria-pressed="${selectedDifficulty==='easy'}"><b>简单</b><span>入门常识</span></button><button class="difficulty ${selectedDifficulty==='hard'?'selected':''}" id="choose-hard" aria-pressed="${selectedDifficulty==='hard'}"><b>困难</b><span>作品细节</span></button></div><button class="primary" id="start">开始星际测试 <span aria-hidden="true">↗</span></button></div><div class="orbit" aria-hidden="true"><div class="planet"></div><div class="planet second"></div>${mascot(3,3,'hero-mascot')}</div></section>`;document.getElementById('start').onclick=start;document.getElementById('choose-easy').onclick=()=>selectDifficulty('easy');document.getElementById('choose-hard').onclick=()=>selectDifficulty('hard');}
function selectDifficulty(value){if(stage!=='home'||!['easy','hard'].includes(value))return;selectedDifficulty=value;home();document.getElementById(value==='easy'?'choose-easy':'choose-hard').focus({preventScroll:true});}
function start(){round=SFAQuiz.drawRound(QUESTIONS,selectedDifficulty);index=0;answers=[];stage='quiz';renderQuestion();focusPage();}
function renderQuestion(){const q=round[index],a=answers[index];const mood=a?(a.correct?[3,2]:[2,1]):[2,1];const companion=a?(a.correct?'这题收到，航向正确！':'又发现了一块新宇宙。'):'不用紧张，带着好奇心选就好。';app.innerHTML=`<div class="quiz-head"><div class="count"><span class="mode-tag">${difficultyLabel()}</span> ${String(index+1).padStart(2,'0')} <small>/ 10</small></div><span class="score-live">已答对 <b>${score()}</b> 题</span><button class="quiet" id="restart">返回首页</button></div><div class="progress" aria-label="第 ${index+1} 题，共 10 题">${round.map((_,i)=>`<span class="${answers[i]?(answers[i].correct?'good':'bad'):i===index?'current':''}"></span>`).join('')}</div><section class="quiz-grid"><div class="question-card"><span class="tag">${esc(q.category)}${q.spoiler?' · 剧情题':''}</span><h2 class="q-title" id="question-title">${esc(q.prompt)}</h2><div class="options" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>{const cls=a?(o.correct?'correct':i===a.choice?'wrong':'dim'):'';return `<button class="option ${cls}" data-choice="${i}" ${a?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o.text)}${a&&o.correct?' ✓':a&&i===a.choice?' ✕':''}</span></button>`;}).join('')}</div>${a?`<div class="feedback ${a.correct?'':'wrong'}" role="status"><strong>${a.correct?'答对了！':'这题的答案是 '+esc(q.options.find(o=>o.correct).text)}</strong><p>${esc(q.explanation)}</p></div>`:''}<div class="question-bottom">${a?`<button class="primary" id="next">${index===9?'查看探索结果':'下一题'} <span aria-hidden="true">→</span></button>`:''}</div></div><aside class="companion">${mascot(...mood)}<div><b>${companion}</b></div></aside></section>`;
document.getElementById('restart').onclick=()=>document.getElementById('restart-dialog').showModal();app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));if(a){document.getElementById('next').onclick=next;document.getElementById('next').focus({preventScroll:true});}}
function choose(choice){if(stage!=='quiz'||answers[index]||!Number.isInteger(choice)||choice<0||choice>3)return;answers[index]={choice,correct:round[index].options[choice].correct};renderQuestion();}
function next(){if(stage!=='quiz'||!answers[index])return;if(index===9){stage='result';result();}else{index++;renderQuestion();}focusPage();}
function result(){const s=score();const title=s===10?'全频段宇宙共鸣':s>=7?'星际探索家':s>=4?'脑洞领航员':'好奇心新航员';const msg=s>=7?'你已经找到了不少宇宙坐标。来幻协，和同好一起继续探索吧。':'宇宙那么大，值得慢慢认识。只要有好奇心，这里就有你的位置。';app.innerHTML=`<section class="result-grid"><div><h1>${title}</h1><div class="score-big" aria-label="答对 ${s} 题，共 10 题">${s}<span>/ 10 题</span></div><p class="score-label">${difficultyLabel()}模式 · 本次答对题数</p><div class="result-message">${mascot(s>=7?3:1,s>=7?2:3)}<p>${msg}</p></div><div class="actions"><button class="primary" id="again">下一位，出发 ↗</button><button class="quiet" id="review-toggle">查看本轮答案</button></div></div><div class="join-card"><h2>你的下一站，是幻协</h2><button class="qr-button" id="show-qr" aria-label="放大招新二维码">${qrMarkup(config)}</button><div class="group">${config.group?'QQ 群号 '+esc(config.group):'扫码加入招新群'}</div><div class="qr-caption">用 QQ 扫一扫 · 点击二维码可放大</div></div></section><dialog id="review-dialog" aria-labelledby="review-title"><div class="dialog-head"><h2 id="review-title">本轮答案 · ${s} / 10</h2><button class="dialog-close" id="close-review" aria-label="关闭答案">×</button></div><div class="review-list">${round.map((q,i)=>`<article class="review-item"><h3><span class="${answers[i].correct?'good-text':'bad-text'}">${answers[i].correct?'✓':'✕'}</span> ${i+1}. ${esc(q.prompt)}</h3><div>你的选择：${esc(q.options[answers[i].choice].text)}　<br>正确答案：${esc(q.options.find(o=>o.correct).text)}</div><p>${esc(q.explanation)}</p><a class="source-link" href="${esc(q.source.url)}" target="_blank" rel="noopener noreferrer">${esc(q.source.name)} ↗</a></article>`).join('')}</div></dialog>`;document.getElementById('again').onclick=()=>{home();focusPage();};document.getElementById('review-toggle').onclick=()=>{document.getElementById('review-dialog').showModal();};document.getElementById('close-review').onclick=()=>document.getElementById('review-dialog').close();document.getElementById('show-qr').onclick=()=>{document.getElementById('large-qr').innerHTML=qrMarkup(config,'dialog-large-qr');document.getElementById('large-group').textContent=config.group?'QQ 群号 '+config.group:'';document.getElementById('qr-dialog').showModal();};}
function previewSettings(){document.getElementById('settings-preview').innerHTML=qrMarkup(pending);}
function status(s){document.getElementById('settings-status').textContent=s;}
document.getElementById('settings').onclick=()=>{pending={...config};document.getElementById('group-input').value=config.group;document.getElementById('qr-upload').value='';status('');previewSettings();document.getElementById('settings-dialog').showModal();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.getElementById('confirm-restart').onclick=()=>{document.getElementById('restart-dialog').close();home();focusPage();};
function saveConfig(){pending.group=document.getElementById('group-input').value.trim();config={...pending};let persisted=true;try{localStorage.setItem(STORE,JSON.stringify(config));}catch{persisted=false;}if(stage==='result')result();status(persisted?'已保存。发送给其他设备前，请导出 HTML。':'已应用到本次打开。此浏览器无法保存设置，请导出 HTML 保留。');}
document.getElementById('save-settings').onclick=()=>{if(imageBusy){status('图片还在读取，请稍候。');return;}saveConfig();};
document.getElementById('qr-upload').onchange=async e=>{const file=e.target.files[0];const version=++uploadVersion;if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>4000000){status('请选择小于 4 MB 的 PNG、JPEG 或 WebP 图片。');return;}imageBusy=true;document.getElementById('save-settings').disabled=true;document.getElementById('export').disabled=true;try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});await new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=data;});if(version!==uploadVersion)return;pending.qr=data;pending.crop=false;previewSettings();status('图片已读取。保存或导出后生效。');}catch{status('无法读取这张图片，请换一张。');}finally{if(version===uploadVersion){imageBusy=false;document.getElementById('save-settings').disabled=false;document.getElementById('export').disabled=false;}}};
document.getElementById('restore-settings').onclick=()=>{uploadVersion++;imageBusy=false;document.getElementById('save-settings').disabled=false;document.getElementById('export').disabled=false;pending={...DEFAULT_CONFIG};document.getElementById('group-input').value=pending.group;previewSettings();saveConfig();};
document.getElementById('export').onclick=()=>{if(imageBusy)return;saveConfig();const clone=document.documentElement.cloneNode(true);clone.querySelector('#embedded-config').textContent=JSON.stringify(config).replace(/</g,'\\u003c');clone.querySelector('#app').innerHTML='';clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));clone.querySelector('#settings-preview').innerHTML='';clone.querySelector('#large-qr').innerHTML='';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SDU-SFA-quiz-configured.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status('已生成包含当前二维码的 HTML，请查看浏览器下载。');};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else{alert('此浏览器暂不支持网页全屏。可以使用平板横屏获得更大画面。');}}catch{alert('未能进入全屏，请使用浏览器全屏或平板横屏。');}};
home();
</script>
</body>
</html>
